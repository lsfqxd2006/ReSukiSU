name: Release ReSukiSU
on:
  workflow_dispatch:

permissions:
  contents: write
  actions: read

jobs:
  build:
    uses: ./.github/workflows/build-manager.yml
    secrets: inherit

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      # 下载所有构建产物（自动解压为文件夹）
      - name: Download all artifacts
        uses: actions/download-artifact@v8
        with:
          path: ./artifacts

      # 查看结构（调试用）
      - name: List artifacts structure
        run: ls -la ./artifacts

      # ==========================================
      # 正确读取版本号（严格按你的路径 apk/release）
      # ==========================================
      - name: Get version from APK
        id: ver
        run: |
          APK=$(find ./artifacts/Manager-release -path "*/apk/release/*.apk" | head -1)
          VERSION=$(echo "$APK" | grep -oE 'v[0-9.]+_[0-9]+' | head -1)
          echo "tag=$VERSION" >> $GITHUB_OUTPUT
          echo "title=ReSukiSU $VERSION" >> $GITHUB_OUTPUT

      # ==========================================
      # 🔥 自动压缩所有文件（和你列表完全一致）
      # ==========================================
      - name: Re-zip ALL artifacts to original format
        run: |
          cd ./artifacts
          for dir in */; do
            name="${dir%/}"
            zip -rq "../$name" "$name"
          done
          cd ..

      # 确认最终所有文件（100% 齐全）
      - name: List final all files
        run: ls -la

      # 创建 TAG
      - name: Create and push tag
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git tag -f "${{ steps.ver.outputs.tag }}"
          git push -f origin "${{ steps.ver.outputs.tag }}"

      # ==========================================
      # 🚀 上传：全部文件！一个不漏！
      # ==========================================
      - name: Create Release & Upload ALL
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ steps.ver.outputs.tag }}
          name: ${{ steps.ver.outputs.title }}
          files: ./*
          overwrite: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
