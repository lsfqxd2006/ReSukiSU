name: Release ReSukiSU
on:
  workflow_dispatch:

permissions:
  contents: write
  actions: read

jobs:
  build:
    uses: ./.github/workflows/build-manager.yml
    secrets: inherit

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      # ==========================================
      # ✅ 下载：原始压缩包（不会自动解压）
      # ==========================================
      - name: Download all artifacts (ZIP)
        uses: actions/download-artifact@v8
        with:
          path: ./artifacts

      # 查看文件（确认是 .zip）
      - name: List files
        run: ls -la ./artifacts

      # ==========================================
      # ✅ 正确提取版本号（严格按你的真实路径）
      # ==========================================
      - name: Get version from APK
        id: ver
        run: |
          # 临时解压
          unzip -q ./artifacts/Manager-release.zip -d tmp
          
          # 🔥 严格按你给的真实路径：apk/release/*.apk
          APK=$(find tmp -path "*/apk/release/*.apk" | head -1)
          
          # 提取版本 vX.X.X_XXXX
          VERSION=$(echo "$APK" | grep -oE 'v[0-9.]+_[0-9]+' | head -1)
          
          echo "tag=$VERSION" >> $GITHUB_OUTPUT
          echo "title=ReSukiSU $VERSION" >> $GITHUB_OUTPUT
          
          rm -rf tmp

      # 创建 TAG
      - name: Create and push tag
        run: |
          git config --global user.name "github-actions"
          git config --global user.email "github-actions@github.com"
          git tag -f "${{ steps.ver.outputs.tag }}"
          git push -f origin "${{ steps.ver.outputs.tag }}"

      # ==========================================
      # ✅ 发布：全部原始压缩包，一个不改
      # ==========================================
      - name: Create Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ steps.ver.outputs.tag }}
          name: ${{ steps.ver.outputs.title }}
          files: ./artifacts/**/*
          overwrite: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
