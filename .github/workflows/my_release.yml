name: Release ReSukiSU
on:
  workflow_dispatch:

permissions:
  contents: write
  actions: read

jobs:
  build:
    uses: ./.github/workflows/build-manager.yml
    secrets: inherit

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      # 下载原始压缩包（无后缀，但本质是ZIP）
      - name: Download all artifacts
        uses: actions/download-artifact@v8
        with:
          path: ./artifacts

      # 查看文件
      - name: List files
        run: ls -la ./artifacts

      # ==========================================
      # 正确获取版本（严格按你的路径）
      # ==========================================
      - name: Get version from APK
        id: ver
        run: |
          unzip -q ./artifacts/Manager-release -d tmp
          APK=$(find tmp -path "*/apk/release/*.apk" | head -1)
          VERSION=$(echo "$APK" | grep -oE 'v[0-9.]+_[0-9]+' | head -1)
          echo "tag=$VERSION" >> $GITHUB_OUTPUT
          echo "title=ReSukiSU $VERSION" >> $GITHUB_OUTPUT
          rm -rf tmp

      # 创建TAG
      - name: Create and push tag
        run: |
          git config --global user.name "github-actions"
          git config --global user.email "github-actions@github.com"
          git tag -f "${{ steps.ver.outputs.tag }}"
          git push -f origin "${{ steps.ver.outputs.tag }}"

      # ==========================================
      # 发布：原封不动上传所有压缩包
      # ==========================================
      - name: Create Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ steps.ver.outputs.tag }}
          name: ${{ steps.ver.outputs.title }}
          files: ./artifacts/**/*
          overwrite: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
