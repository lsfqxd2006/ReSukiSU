name: Release ReSukiSU
on:
  workflow_dispatch:

permissions:
  contents: write
  actions: read

jobs:
  build:
    uses: ./.github/workflows/build-manager.yml
    secrets: inherit

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      # ==========================================
      # 下载后自动变成文件夹（这是GitHub默认行为）
      # ==========================================
      - name: Download all artifacts
        uses: actions/download-artifact@v8
        with:
          path: ./artifacts

      # 查看结构
      - name: List files
        run: ls -la ./artifacts

      # ==========================================
      # 正确获取版本：直接从文件夹读取！不用unzip！
      # 你的真实路径：apk/release/*.apk
      # ==========================================
      - name: Get version from APK
        id: ver
        run: |
          APK=$(find ./artifacts/Manager-release -path "*/apk/release/*.apk" | head -1)
          VERSION=$(echo "$APK" | grep -oE 'v[0-9.]+_[0-9]+' | head -1)
          echo "tag=$VERSION" >> $GITHUB_OUTPUT
          echo "title=ReSukiSU $VERSION" >> $GITHUB_OUTPUT

      # ==========================================
      # 重新压缩 → 和官方完全一样的格式（无后缀zip）
      # 用户下载会自动变成 .zip
      # ==========================================
      - name: Re-zip artifacts to original format
        run: |
          cd ./artifacts
          for dir in */; do
            dirname=${dir%/}
            zip -rq "../$dirname" "$dir"
          done
          cd ..

      # 创建TAG
      - name: Create and push tag
        run: |
          git config --global user.name "github-actions"
          git config --global user.email "github-actions@github.com"
          git tag -f "${{ steps.ver.outputs.tag }}"
          git push -f origin "${{ steps.ver.outputs.tag }}"

      # ==========================================
      # 发布：和官方完全一样的压缩包
      # ==========================================
      - name: Create Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ steps.ver.outputs.tag }}
          name: ${{ steps.ver.outputs.title }}
          files: |
            Manager-release
            Manager-debug
            Spoofed-Manager-release
            Spoofed-Manager-debug
            android12-5.10-lkm
            android13-5.10-lkm
            android13-5.15-lkm
            android14-5.15-lkm
            android14-6.1-lkm
            android15-6.6-lkm
            android16-6.12-lkm
            ksud-aarch64-linux-android
            ksud-armv7-linux-androideabi
            ksud-x86_64-linux-android
            ksuinit
          overwrite: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
