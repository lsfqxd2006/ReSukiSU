name: Release ReSukiSU
on:
  workflow_dispatch:

permissions:
  contents: write
  actions: read

jobs:
  build:
    uses: ./.github/workflows/build-manager.yml
    secrets: inherit

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Download all artifacts
        uses: actions/download-artifact@v8
        with:
          path: ./artifacts

      - name: List artifacts structure
        run: ls -la ./artifacts

      # ==========================================
      # 正确读取版本号
      # ==========================================
      - name: Get version from APK
        id: ver
        run: |
          APK=$(find ./artifacts/Manager-release -path "*/apk/release/*.apk" | head -1)
          VERSION=$(echo "$APK" | grep -oE 'v[0-9.]+_[0-9]+' | head -1)
          echo "tag=$VERSION" >> $GITHUB_OUTPUT
          echo "title=ReSukiSU $VERSION" >> $GITHUB_OUTPUT

      # ==========================================
      # 🔥 只压缩你指定的 15 个文件，绝对干净
      # ==========================================
      - name: Re-zip ONLY required artifacts
        run: |
          cd ./artifacts
          zip -rq "../Manager-debug" Manager-debug
          zip -rq "../Manager-release" Manager-release
          zip -rq "../Spoofed-Manager-debug" Spoofed-Manager-debug
          zip -rq "../Spoofed-Manager-release" Spoofed-Manager-release
          zip -rq "../android12-5.10-lkm" android12-5.10-lkm
          zip -rq "../android13-5.10-lkm" android13-5.10-lkm
          zip -rq "../android13-5.15-lkm" android13-5.15-lkm
          zip -rq "../android14-5.15-lkm" android14-5.15-lkm
          zip -rq "../android14-6.1-lkm" android14-6.1-lkm
          zip -rq "../android15-6.6-lkm" android15-6.6-lkm
          zip -rq "../android16-6.12-lkm" android16-6.12-lkm
          zip -rq "../ksud-aarch64-linux-android" ksud-aarch64-linux-android
          zip -rq "../ksud-armv7-linux-androideabi" ksud-armv7-linux-androideabi
          zip -rq "../ksud-x86_64-linux-android" ksud-x86_64-linux-android
          zip -rq "../ksuinit" ksuinit
          cd ..

      - name: List final all files
        run: ls -la

      # ==========================================
      # 创建 TAG
      # ==========================================
      - name: Create and push tag
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git tag -f "${{ steps.ver.outputs.tag }}"
          git push -f origin "${{ steps.ver.outputs.tag }}"

      # ==========================================
      # 🎯 只上传你指定的 15 个文件！绝对干净！
      # ==========================================
      - name: Create Release & Upload ALL
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ steps.ver.outputs.tag }}
          name: ${{ steps.ver.outputs.title }}
          files: |
            Manager-debug
            Manager-release
            Spoofed-Manager-debug
            Spoofed-Manager-release
            android12-5.10-lkm
            android13-5.10-lkm
            android13-5.15-lkm
            android14-5.15-lkm
            android14-6.1-lkm
            android15-6.6-lkm
            android16-6.12-lkm
            ksud-aarch64-linux-android
            ksud-armv7-linux-androideabi
            ksud-x86_64-linux-android
            ksuinit
          overwrite: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
