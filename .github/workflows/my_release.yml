name: Release ReSukiSU
on:
  workflow_dispatch:

permissions:
  contents: write
  actions: read

jobs:
  build:
    uses: ./.github/workflows/build-manager.yml
    secrets: inherit

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Download all artifacts
        uses: actions/download-artifact@v8
        with:
          path: ./artifacts

      # 显示完整结构（调试用）
      - name: Tree artifacts
        run: find ./artifacts

      # ==========================================
      # 正确读取版本号
      # ==========================================
      - name: Get version from APK
        id: ver
        run: |
          APK=$(find ./artifacts -path "*/Manager-release/apk/release/*.apk" | head -1)
          VERSION=$(echo "$APK" | grep -oE 'v[0-9.]+_[0-9]+' | head -1)
          echo "tag=$VERSION" >> $GITHUB_OUTPUT
          echo "title=ReSukiSU $VERSION" >> $GITHUB_OUTPUT

      # ==========================================
      # 🔥 最安全：进入对应目录直接压缩
      # 绝对能找到所有文件！
      # ==========================================
      - name: Pack all required files
        run: |
          mkdir -p upload
          
          # Manager
          zip -rq ./upload/Manager-debug ./artifacts/Manager-debug
          zip -rq ./upload/Manager-release ./artifacts/Manager-release
          zip -rq ./upload/Spoofed-Manager-debug ./artifacts/Spoofed-Manager-debug
          zip -rq ./upload/Spoofed-Manager-release ./artifacts/Spoofed-Manager-release
          
          # LKM
          zip -rq ./upload/android12-5.10-lkm ./artifacts/android12-5.10-lkm
          zip -rq ./upload/android13-5.10-lkm ./artifacts/android13-5.10-lkm
          zip -rq ./upload/android13-5.15-lkm ./artifacts/android13-5.15-lkm
          zip -rq ./upload/android14-5.15-lkm ./artifacts/android14-5.15-lkm
          zip -rq ./upload/android14-6.1-lkm ./artifacts/android14-6.1-lkm
          zip -rq ./upload/android15-6.6-lkm ./artifacts/android15-6.6-lkm
          zip -rq ./upload/android16-6.12-lkm ./artifacts/android16-6.12-lkm
          
          # ksud
          zip -rq ./upload/ksud-aarch64-linux-android ./artifacts/ksud-aarch64-linux-android
          zip -rq ./upload/ksud-armv7-linux-androideabi ./artifacts/ksud-armv7-linux-androideabi
          zip -rq ./upload/ksud-x86_64-linux-android ./artifacts/ksud-x86_64-linux-android
          
          # ksuinit
          zip -rq ./upload/ksuinit ./artifacts/ksuinit

      - name: List upload files
        run: ls -la ./upload

      # 创建 TAG
      - name: Create and push tag
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git tag -f "${{ steps.ver.outputs.tag }}"
          git push -f origin "${{ steps.ver.outputs.tag }}"

      # ==========================================
      # 只上传 upload 目录（100% 干净，无多余文件）
      # ==========================================
      - name: Create Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ steps.ver.outputs.tag }}
          name: ${{ steps.ver.outputs.title }}
          files: ./upload/*
          overwrite: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
