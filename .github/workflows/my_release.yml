name: Release ReSukiSU

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-manager:
    uses: ./.github/workflows/build-manager.yml
    secrets: inherit

  release:
    needs: build-manager
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      # 下载所有构建产物（完整结构）
      - name: Download all artifacts
        uses: actions/download-artifact@v8
        with:
          path: ./

      # 列出所有文件（用于调试）
      - name: List all files
        run: ls -R

      # 提取所有APK到根目录
      - name: Collect APKs
        run: |
          find Manager-release -name "*.apk" -exec mv {} . \;
          find Manager-debug -name "*.apk" -exec mv {} . \;
          find Spoofed-Manager-release -name "*.apk" -exec mv {} . \;
          find Spoofed-Manager-debug -name "*.apk" -exec mv {} . \;

      # 提取所有 ksud 二进制
      - name: Collect ksud
        run: |
          find ksud-*/release -name "ksud" -exec mv {} . \;

      # 提取 ksuinit
      - name: Collect ksuinit
        run: |
          find . -name "ksuinit" -exec mv {} . \;

      # 自动从APK文件名获取版本号
      - name: Get version
        id: ver
        run: |
          APK=$(ls ReSukiSU_*.apk | head -1)
          VERSION=$(echo "$APK" | grep -oE 'v[0-9.]+_[0-9]+')
          echo "tag=$VERSION" >> "$GITHUB_OUTPUT"
          echo "title=ReSukiSU $VERSION" >> "$GITHUB_OUTPUT"

      # 创建Tag
      - name: Create and push tag
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag -f "${{ steps.ver.outputs.tag }}"
          git push -f origin "${{ steps.ver.outputs.tag }}"

      # 发布所有文件（完整不漏）
      - name: Create Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ steps.ver.outputs.tag }}
          name: "ReSukiSU ${{ steps.ver.outputs.tag }}"
          body: |
            自动构建 ReSukiSU
            ✅ Manager 多平台
            ✅ Spoofed Manager
            ✅ LKM 模块
            ✅ ksud 多平台
            ✅ ksuinit
          files: |
            *.apk
            *.ko
            ksud*
            ksuinit
          overwrite_files: true
          generate_release_notes: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
