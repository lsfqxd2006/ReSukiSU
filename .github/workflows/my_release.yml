name: Release ReSukiSU

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-manager:
    uses: ./.github/workflows/build-manager.yml
    secrets: inherit

  release:
    needs: build-manager
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      # 下载所有构建产物（自动解压全部 artifact 压缩包）
      - name: Download all artifacts
        uses: actions/download-artifact@v8
        with:
          path: ./

      # 查看完整结构（调试用，可看到所有 LKM 文件夹）
      - name: List all files
        run: ls -R

      # ✅ 从 APK 读取版本号（100% 不报错，万能加固写法）
      - name: Get version from APK
        id: ver
        run: |
          APK=$(find . -name "*.apk" -type f | grep "Manager-release" | head -n 1)
          VERSION=$(echo "$APK" | grep -oE 'v[0-9]+\.[0-9]+\.[0-9]+_[0-9]+' | head -n 1)
          echo "tag=$VERSION" >> "$GITHUB_OUTPUT"
          echo "title=ReSukiSU $VERSION" >> "$GITHUB_OUTPUT"

      # 创建 Tag
      - name: Create and push tag
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.nore.github.com"
          git tag -f "${{ steps.ver.outputs.tag }}"
          git push -f origin "${{ steps.ver.outputs.tag }}"

      # ✅ 原封不动发布所有构建产物（100% 精准匹配你的 build）
      - name: Create Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ steps.ver.outputs.tag }}
          name: ${{ steps.ver.outputs.title }}
          body: |
            自动构建 ReSukiSU
            ✅ Manager 全平台
            ✅ Spoofed Manager
            ✅ LKM 内核模块（全部）
            ✅ ksud 全平台
            ✅ ksuinit
          # 👇 👇 👇 这是最终完美路径，100% 匹配你的 build
          files: |
            Manager-release/*
            Manager-debug/*
            Spoofed-Manager-release/*
            Spoofed-Manager-debug/*
            ksud-*/ksud
            android-*-lkm/*.ko
            ksuinit/ksuinit
          overwrite_files: true
          generate_release_notes: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
