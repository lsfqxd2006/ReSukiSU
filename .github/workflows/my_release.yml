name: Release ReSukiSU

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-manager:
    uses: ./.github/workflows/build-manager.yml
    secrets: inherit

  release:
    needs: build-manager
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      # 下载所有构建产物（保持原始结构，绝对不动）
      - name: Download all artifacts
        uses: actions/download-artifact@v8
        with:
          path: ./

      # 调试：查看原始结构
      - name: List all files
        run: ls -R

      # 从构建好的APK自动提取版本号（你要的逻辑）
      - name: Get version from APK
        id: ver
        run: |
          APK=$(ls Manager-release/ReSukiSU_*.apk | head -1)
          VERSION=$(echo "$APK" | grep -oE 'v[0-9.]+_[0-9]+')
          echo "tag=$VERSION" >> "$GITHUB_OUTPUT"
          echo "title=ReSukiSU $VERSION" >> "$GITHUB_OUTPUT"

      # 创建并推送Tag
      - name: Create and push tag
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag -f "${{ steps.ver.outputs.tag }}"
          git push -f origin "${{ steps.ver.outputs.tag }}"

      # ✅ 原封不动发布所有构建产物（一个都不漏）
      - name: Create Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ steps.ver.outputs.tag }}
          name: ${{ steps.ver.outputs.title }}
          body: |
            自动构建 ReSukiSU
            ✅ Manager 全平台
            ✅ Spoofed Manager
            ✅ LKM 内核模块
            ✅ ksud 全平台
            ✅ ksuinit
          # 👇 完全按照你的build产物原样发布
          files: |
            Manager-release/*
            Manager-debug/*
            Spoofed-Manager-release/*
            Spoofed-Manager-debug/*
            ksud-aarch64-linux-android/ksud
            ksud-x86_64-linux-android/ksud
            ksud-armv7-linux-androideabi/ksud
            ksuinit
            android*-lkm/*.ko
          overwrite_files: true
          generate_release_notes: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
