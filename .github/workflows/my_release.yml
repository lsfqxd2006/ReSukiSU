name: Release ReSukiSU
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    uses: ./.github/workflows/build-manager.yml
    secrets: inherit

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      # 下载所有产物（全部是原始压缩包）
      - name: Download all artifacts
        uses: actions/download-artifact@v8
        with:
          path: ./

      # 查看文件
      - name: List files
        run: ls -la

      # ==========================================
      # ✅ 严格按 build.yml 路径 提取版本号
      # 解压 Manager-release → 读取内部正确路径的 APK
      # ==========================================
      - name: Get version from correct APK path
        id: ver
        run: |
          # 临时解压（仅读取版本，不影响发布文件）
          unzip -q Manager-release -d tmp
          
          # 【严格按你的 build 脚本内部路径】
          APK=$(find tmp -path "*/outputs/apk/release/*.apk" | head -1)
          
          # 提取版本号
          VERSION=$(echo "$APK" | grep -oE 'v[0-9.]+_[0-9]+' | head -1)
          
          # 输出
          echo "tag=$VERSION" >> "$GITHUB_OUTPUT"
          echo "title=ReSukiSU $VERSION" >> "$GITHUB_OUTPUT"
          
          # 删除临时文件（完全不影响发布）
          rm -rf tmp

      # 创建 tag
      - name: Create tag
        run: |
          git config --global user.name "github-actions"
          git config --global user.email "github-actions@github.com"
          git tag -f "${{ steps.ver.outputs.tag }}"
          git push -f origin "${{ steps.ver.outputs.tag }}"

      # ==========================================
      # ✅ 原封不动上传所有压缩包（一个不改）
      # ==========================================
      - name: Create Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ steps.ver.outputs.tag }}
          name: ${{ steps.ver.outputs.title }}
          files: |
            Manager-debug
            Manager-release
            Spoofed-Manager-debug
            Spoofed-Manager-release
            android12-5.10-lkm
            android13-5.10-lkm
            android13-5.15-lkm
            android14-5.15-lkm
            android14-6.1-lkm
            android15-6.6-lkm
            android16-6.12-lkm
            ksud-aarch64-linux-android
            ksud-armv7-linux-androideabi
            ksud-x86_64-linux-android
            ksuinit
          overwrite: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
